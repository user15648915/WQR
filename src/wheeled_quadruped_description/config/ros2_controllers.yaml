controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    leg_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    wheel_controller:
      type: velocity_controllers/JointGroupVelocityController

leg_controller:
  ros__parameters:
    joints:
      - fl_hip_joint
      - fl_thigh_joint
      - fl_shank_joint
      - fr_hip_joint
      - fr_thigh_joint
      - fr_shank_joint
      - rl_hip_joint
      - rl_thigh_joint
      - rl_shank_joint
      - rr_hip_joint
      - rr_thigh_joint
      - rr_shank_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    gains:
      fl_hip_joint: {p: 220.0, i: 10.0, d: 8.0, i_clamp: 12.0, ff_velocity_scale: 0.0}
      fl_thigh_joint: {p: 220.0, i: 10.0, d: 8.0, i_clamp: 12.0, ff_velocity_scale: 0.0}
      fl_shank_joint: {p: 220.0, i: 10.0, d: 8.0, i_clamp: 12.0, ff_velocity_scale: 0.0}
      fr_hip_joint: {p: 220.0, i: 10.0, d: 8.0, i_clamp: 12.0, ff_velocity_scale: 0.0}
      fr_thigh_joint: {p: 220.0, i: 10.0, d: 8.0, i_clamp: 12.0, ff_velocity_scale: 0.0}
      fr_shank_joint: {p: 220.0, i: 10.0, d: 8.0, i_clamp: 12.0, ff_velocity_scale: 0.0}
      rl_hip_joint: {p: 220.0, i: 10.0, d: 8.0, i_clamp: 12.0, ff_velocity_scale: 0.0}
      rl_thigh_joint: {p: 220.0, i: 10.0, d: 8.0, i_clamp: 12.0, ff_velocity_scale: 0.0}
      rl_shank_joint: {p: 220.0, i: 10.0, d: 8.0, i_clamp: 12.0, ff_velocity_scale: 0.0}
      rr_hip_joint: {p: 220.0, i: 10.0, d: 8.0, i_clamp: 12.0, ff_velocity_scale: 0.0}
      rr_thigh_joint: {p: 220.0, i: 10.0, d: 8.0, i_clamp: 12.0, ff_velocity_scale: 0.0}
      rr_shank_joint: {p: 220.0, i: 10.0, d: 8.0, i_clamp: 12.0, ff_velocity_scale: 0.0}

wheel_controller:
  ros__parameters:
    joints:
      - fl_wheel_joint
      - fr_wheel_joint
      - rl_wheel_joint
      - rr_wheel_joint
